include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
    - build/**
    - android/**
    - ios/**
  errors:
    # Uygulama kodu; public API dokümantasyonu zorunlu değil
    public_member_api_docs: ignore

plugins:
  riverpod_lint: ^3.2.0

linter:
  rules:
    # Türkçe yorum + İngilizce isim kuralı; satır uzunluğu formatter'a bırakıldı
    lines_longer_than_80_chars: false
    # Dart 3.14'ün `new(...)` kısa constructor sözdizimi yerine klasik
    # `ClassName(...)` yazımı; okuyan herkesin aşina olduğu biçim.
    unnecessary_type_name_in_constructor: false
